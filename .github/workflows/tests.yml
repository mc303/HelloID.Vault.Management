name: Tests

on:
  push:
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run tests
        run: |
          if [ -f HelloID.Vault.Tests.sln ]; then
            dotnet test HelloID.Vault.Tests.sln --configuration Release
          else
            echo "Tests solution not present (production deploy repo) - skipping"
          fi
